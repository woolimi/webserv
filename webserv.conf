server {
	listen 8080;
	server_name	localhost;
	root /home/wpark/Documents/webserv/;
	error_page /home/wpark/Documents/webserv/www/error.html;
	client_max_body_size 1M;

	# autoindex on;
	location / {
		allow GET POST;
		autoindex on;
		
		root /home/wpark/Documents/webserv/www/;
		# which php-cgi
		cgi .php /usr/bin/php-cgi;
	}
}
