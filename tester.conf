server {
	listen 8080;
	root ./www/;

	client_max_body_size 200M;

	location / {
		allow GET;
		index youpi.bad_extension default.html;
		autoindex on;
		root ./www/;
	}
	location /directory/ {
		index youpi.bad_extension;
		cgi .bla ./www/ubuntu_cgi_tester;
		root ./www/YoupiBanane;
	}

	location /put_test/ {
		index youpi.bad_extension;
		root ./www/YoupiBanane;
		upload_folder ./www/upload/;
	}

	location /post_body {
		client_max_body_size 100;
		index youpi.bad_extension;
		root ./www/;
	}
}
